[package]
name = "scanner_n8n"
version = "1.2.4"
edition = "2024"
description = "Application desktop pour connecter un scanner de codes-barres Bluetooth à n8n via webhook"
license = "MIT"

[dependencies]
eframe = "0.29"
serialport = "4.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
qrcodegen = "1.8"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# Icône et métadonnées de l'exécutable Windows (no-op sur les autres OS)
winresource = "0.1"

# Icône dynamique du Dock macOS (déjà présent dans l'arbre via eframe)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.2", features = ["NSData"] }
