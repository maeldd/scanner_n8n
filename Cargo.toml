[package]
name = "scanner_n8n"
version = "1.0.0"
edition = "2024"
description = "Application desktop pour connecter un scanner de codes-barres Bluetooth à n8n via webhook"
license = "MIT"

[dependencies]
eframe = "0.29"
serialport = "4.3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }